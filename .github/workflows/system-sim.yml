name: System Simulation CI

on:
  push:
    branches: [ pipeline, processor-toolchain, main ]
  pull_request:
    branches: [ pipeline, main ]

jobs:
  simulate-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RISC-V Toolchain and Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf verilator python3

      - name: Run Full Assembly Simulation Suite
        run: |
          bash run_all_asm_tests.sh --simulate
